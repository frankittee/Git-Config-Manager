[package]
name = "g"
version = "0.6.0"
edition = "2024"
description = "Switch Git identity profiles in the current repository"
license = "MIT"

[[bin]]
name = "g"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
usage = { package = "usage-rs", version = "6" }
crossterm = "0.28"
directories = "6.0"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
ssh2-config-rs = "0.7"
tempfile = "3.20"
toml = "0.9"

[dev-dependencies]
tempfile = "3.20"
